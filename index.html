<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=-, initial-scale=1.0">
    <title>Furuyama Currency Converter</title>
    <link rel="stylesheet" href="./styles.css">

<!-- Fonts -->    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    
<section id = allContent>

<!---------------------------------------->

<header id="mainHeader">  <h1 id="title">Furuyama Currency Converter</h1> </header>

<!---------------------------------------->
<main id="mainContent">

<label class="valuesFromLabels"> Converter de:
    <select class="valuesFromSelect"> 

<option> Real Brasileiro $ </option>

    </select> 
</label>

<!---------------------------------------->

<label class="valuesFromLabels"> Converter para:
    <select class="valuesFromSelect">  

<option> Dólar Americano US$ </option> <option> Euro € </option> <option> Iene ¥ </option> <option> Bitcoin ₿ </option>

    </select> 
</label>

<!---------------------------------------->

<label class="valuesFromLabels"> Valor:
 
<input class="valueFromInput" placeholder="R$1,00">

</label>

<button id="convertButton"> Converter </button>

<!---------------------------------------->

<section id = illustrantionsSection>

<div id="brazilImgBox">

    <img id= brazilImg src="./assets/brazilimg.png" alt="brazilImg.png">
    <p> Real R$ </p>
    <p> R$ 1,00 </p>

</div>

<img id="setaImg" src="./assets/setaimg.png" alt="setaImg.png">

<div id="usaImgBox">

    <img id = usaImg src="./assets/usaimg.png" alt="usaImg.png">
    <p> Dólar US$ </p>
    <p> US$ 1,00 </p>

</div>

</section>

</main>

<!---------------------------------------->
</section>

</body>
</html>
